name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cli:
    name: CLI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked

  pi-extension:
    name: Pi extension
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pi-hledit-diff
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Rust toolchain
        working-directory: cli
        run: rustup show active-toolchain
      - name: Test CLI on Windows
        working-directory: cli
        run: cargo test --locked
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pi-hledit-diff/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Verify tracked bundled CLI provenance
        shell: pwsh
        run: ../cli/build-bundle.ps1 -VerifyOnly
      - name: Verify tracked bundled CLI contract
        run: npm run test:bundled
      - name: Build bundled CLI from current source
        shell: pwsh
        run: ../cli/build-bundle.ps1
      - name: Verify rebuilt bundled CLI provenance
        shell: pwsh
        run: ../cli/build-bundle.ps1 -VerifyOnly
      - name: Verify rebuilt bundled CLI contract
        run: npm run test:bundled
      - name: Check
        run: npm run check
